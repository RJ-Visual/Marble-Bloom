<body>
  <main class="app" id="app">
    <div class="eyebrow">A LITTLE COLOR. A LITTLE CALM.</div>
    <header class="heading">
      <div class="logo-lockup">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 50 50"><g fill="#e99aa8"><ellipse cx="25" cy="12" rx="8" ry="11"/><ellipse cx="38" cy="24" rx="8" ry="11" transform="rotate(70 38 24)"/><ellipse cx="32" cy="38" rx="8" ry="11" transform="rotate(145 32 38)"/><ellipse cx="15" cy="36" rx="8" ry="11" transform="rotate(215 15 36)"/><ellipse cx="12" cy="22" rx="8" ry="11" transform="rotate(290 12 22)"/></g><circle cx="25" cy="25" r="9" fill="#f4bf76"/></svg></div>
        <div><div class="wordmark">Marble Bloom</div><div class="subline">sort · pop · collect</div></div>
      </div>
      <nav class="head-actions" aria-label="Game menu">
        <button class="icon-btn" id="collectionBtn" title="Collection" aria-label="Open collection">✿</button>
        <button class="icon-btn" id="statsBtn" title="Test stats" aria-label="Open test statistics">▤</button>
        <button class="icon-btn" id="soundBtn" title="Sound toggle" aria-label="Toggle sound">♫</button>
      </nav>
    </header>
    <div class="level-head"><strong id="levelTitle">LEVEL 01</strong><span class="level-sub" id="levelSub">01 / 20 · FIRST BLOOM</span></div>
    <div class="progress-track"><div class="progress-fill" id="levelProgress"></div></div>
    <section class="art-card" aria-label="Collectible artwork">
      <div class="art-title" id="artTitle">Peach Petals</div>
      <div id="artWork"></div>
      <div class="art-progress" id="artProgress">0 / 2 colors added</div>
    </section>
    <div class="worktop">
      <div class="section-head"><span class="section-title">SORTING TRAY</span><span class="section-note" id="trayCount">0 / 7</span></div>
      <div class="tray" id="tray" aria-label="Marble sorting tray" aria-live="polite"></div>
    </div>
    <div class="tubes-head"><span class="section-title">YOUR TUBES</span><span class="helper" id="helper">Tap a tube. Match <strong>3 of a color.</strong></span></div>
    <div class="tubes" id="tubes" aria-label="Three marble tubes"></div>
    <button class="primary-btn round-action" id="roundAction" hidden></button>
    <div class="bottom-bar"><button class="secondary-btn" id="restartBtn">↻ &nbsp; Restart</button><button class="secondary-btn" id="hintBtn">✦ &nbsp; Hint</button></div>
    <div class="footer-note">TAKE YOUR TIME. MAKE SOMETHING LOVELY.</div>
  </main>
  <div class="toast" role="status" id="toast"></div>
  <div class="overlay" id="overlay" role="presentation"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Game dialog"></div></div>

      if(locked||state.ended||!state.tubes[i]?.length)return;
      const round=state;locked=true;
      let c=round.tubes[i][0],from=$('tubes').querySelector(`[data-pipe="${i}"] .tube-ball`),to=$('tray').querySelector(`[data-index="${round.tray.length}"]`);
      $('tubes').querySelectorAll('button').forEach(button=>button.disabled=true);$('hintBtn').disabled=true;$('restartBtn').disabled=true;
      note(350,.075,'sine',.04);round.moves++;log('marble_pick',{pipe:i+1,color:c,moves:round.moves});
      await fly(from,to,c);if(!isCurrent(round))return;
      round.tubes[i].shift();round.tray.push(c);round.landedIndex=round.tray.length-1;render();
      const landingMove=round.moves;
      setTimeout(()=>{if(isCurrent(round)&&round.moves===landingMove){round.landedIndex=null;$('tray').querySelectorAll('.new-ball').forEach(slot=>slot.classList.remove('new-ball'))}},280);
      const hasTriple=round.tray.filter(v=>v===c).length>=3;
      if(hasTriple){
        await sleep(115);if(!isCurrent(round))return;
        const slots=[...$('tray').querySelectorAll('.slot')];round.tray.forEach((v,j)=>{if(v===c)slots[j]?.classList.add('matched')});
        note(600,.14,'sine',.085);setTimeout(()=>{if(isCurrent(round))note(830,.14,'sine',.05)},90);
        await sleep(245);if(!isCurrent(round))return;
        let removed=0;round.tray=round.tray.filter(v=>v!==c||++removed>3);round.painted.push(PALETTE[c]);round.landedIndex=null;
        log('triple_match',{color:c,matches:round.painted.length});
        if(navigator.vibrate)navigator.vibrate(12);
      }
      const won=round.tubes.every(t=>!t.length)&&!round.tray.length;
      const lost=round.tray.length>=7;
      round.ended=won||lost;round.result=won?'win':lost?'loss':null;locked=false;
      if(won){
        progress.completed[round.levelIndex]=round.painted.slice();progress.unlocked=Math.max(progress.unlocked,Math.min(round.levelIndex+1,LEVELS.length-1));
        log('level_win',{moves:round.moves,duration_seconds:Math.round((Date.now()-round.started)/1000)});
      }else if(lost)log('level_lose',{moves:round.moves,duration_seconds:Math.round((Date.now()-round.started)/1000)});
      render();
      if(won){await sleep(290);if(isCurrent(round))showWin()}
      else if(lost){note(225,.24,'triangle',.07);await sleep(230);if(isCurrent(round))showLose()}
      else if(hasTriple){toast(['Lovely! ✿','Perfect match!','Nice pop!','So satisfying!'][Math.floor(Math.random()*4)])}
    }
    function solveMove(){
      const max=state.tubes.reduce((m,t)=>Math.max(m,...t),0)+1;
      const memo=new Set();
      function find(p,counts){
        const key=p.join(',')+'|'+counts.join(',');if(memo.has(key))return null;
        if(p.every((v,i)=>v>=state.tubes[i].length))return counts.every(c=>c===0)?[]:null;
        for(let i=0;i<state.tubes.length;i++){
          if(p[i]>=state.tubes[i].length)continue;
          let c=state.tubes[i][p[i]],next=counts.slice();next[c]++;
          if(next[c]===3)next[c]=0;
          if(next.reduce((a,b)=>a+b,0)>=7)continue;
          let pp=p.slice();pp[i]++;
          const rest=find(pp,next);if(rest!==null)return [i,...rest];
        }
        memo.add(key);return null;
      }
      let counts=Array(Math.max(max,PALETTE.length)).fill(0);state.tray.forEach(c=>counts[c]++);
      let path=find([0,0,0],counts);return path?.length?path[0]:null;
    }
    function getHint(){if(locked||state.ended)return;log('hint_requested');let move=solveMove();
      if(move===null){toast('No safe route left — try Restart ↻');return}
      const target=$('tubes').querySelector(`[data-pipe="${move}"]`);target?.classList.add('suggested');toast(`Try tube ${move+1} ✨`);setTimeout(()=>target?.classList.remove('suggested'),2700)
    }
    const overlay=$('overlay'),modal=$('modal');
    let returnFocus=null;
    function showModal(inner){
      if(!overlay.classList.contains('show'))returnFocus=document.activeElement;
      modal.innerHTML=`<button class="modal-close" id="closeModal" aria-label="Close dialog">×</button>${inner}`;
      const heading=modal.querySelector('h2');if(heading){heading.id='dialogTitle';modal.setAttribute('aria-labelledby','dialogTitle')}
      overlay.classList.add('show');$('app').inert=true;
      $('closeModal').onclick=()=>closeModal();
      (modal.querySelector('.primary-btn')||$('closeModal')).focus({preventScroll:true});
    }
    function closeModal(restoreFocus=true){
      const wasOpen=overlay.classList.contains('show');overlay.classList.remove('show');modal.innerHTML='';$('app').inert=false;
      if(restoreFocus&&wasOpen){
        const fallback=!$('roundAction').hidden?$('roundAction'):$('tubes').querySelector('button:not(:disabled)')||$('restartBtn');
        const target=returnFocus?.isConnected&&!returnFocus.disabled&&!returnFocus.hidden?returnFocus:fallback;
        target?.focus({preventScroll:true});
      }
      returnFocus=null;
    }
    function showWin(){
      if(state.result!=='win')return;
      const round=state,lvl=LEVELS[round.levelIndex],complete=collectionCount()===LEVELS.length;
      note(740,.18,'sine',.06);setTimeout(()=>{if(isCurrent(round))note(990,.23,'sine',.06)},120);
      showModal(`<div class="modal-badge">✦ ARTWORK UNLOCKED ✦</div>${drawPattern(lvl.kind,round.painted,countGroups(lvl.tubes),getArtPlan(lvl)).replace('class="art-svg"','class="hero-svg"')}<h2>${complete?'Collection complete!':'Beautifully done!'}</h2><p>You completed <strong>${lvl.name}</strong> in ${round.moves} moves. ${complete?`All ${LEVELS.length} artworks are in your collection.`:`${collectionCount()} of ${LEVELS.length} artworks collected.`}</p><button class="primary-btn" id="nextLevel">${complete?'✿ View Collection':'Next Puzzle →'}</button><button class="secondary-btn" id="viewCollection">See Collection</button>`);
      $('nextLevel').onclick=continueRound;
      $('viewCollection').onclick=showCollection;
    }
    function showLose(){
      if(state.result!=='loss')return;
      showModal(`<div class="modal-badge">THE TRAY IS FULL</div><div style="font-size:55px;margin:16px 0 4px">🫧</div><h2>One more try?</h2><p>Your sorting tray has 7 marbles. Choose your colors in a different order to clear more triples.</p><button class="primary-btn" id="tryAgain">↻ Try Again</button><button class="secondary-btn" id="loseHint">Show a Hint on Restart</button>`);
      $('tryAgain').onclick=()=>restartLevel('lose_retry');
      $('loseHint').onclick=()=>{restartLevel('lose_hint');getHint()};
    }
    function showCollection(page=0){log('collection_opened');
      const pageSize=6,lastPage=Math.ceil(LEVELS.length/pageSize)-1;
      page=Number.isInteger(page)?Math.max(0,Math.min(lastPage,page)):0;
      const first=page*pageSize,last=Math.min(first+pageSize,LEVELS.length);
      const html=LEVELS.slice(first,last).map((lvl,offset)=>{
        const i=first+offset;
        const painted=progress.completed[i];const completed=!!painted;return `<div class="collection-item ${completed?'':'locked'}"><div>${drawPattern(lvl.kind,painted||[],countGroups(lvl.tubes),getArtPlan(lvl))}</div><div class="name">${lvl.name}</div><div class="tag">${completed?'✓ Collected':'♡ Locked'}</div></div>`
      }).join('');
      showModal(`<div class="modal-badge">YOUR LITTLE GARDEN</div><h2>Art Collection</h2><p>${collectionCount()} of ${LEVELS.length} artworks collected.</p><div class="collection-grid">${html}</div><div class="collection-nav"><button class="secondary-btn" id="collectionPrev" aria-label="Previous artwork page" ${page===0?'disabled':''}>← Previous</button><span id="collectionPage" aria-live="polite">${first+1}–${last} of ${LEVELS.length}</span><button class="secondary-btn" id="collectionNext" aria-label="Next artwork page" ${page===lastPage?'disabled':''}>Next →</button></div><button class="secondary-btn" id="closeCollection">Back to Puzzle</button>`);
      $('collectionPrev').onclick=()=>showCollection(page-1);
      $('collectionNext').onclick=()=>showCollection(page+1);
      $('closeCollection').onclick=()=>closeModal();
    }
    const csvCell=value=>`"${String(value??'').replace(/"/g,'""')}"`;
    function statsCSV(){
      const cols=['time','type','level','pipe','color','moves','matches','duration_seconds','round_id','session_id','source','from_result'];
      return [cols.join(','),...events.map(e=>cols.map(k=>csvCell(e[k])).join(','))].join('\r\n');
    }
    function downloadStats(){
      const url=URL.createObjectURL(new Blob([statsCSV()],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='marble-bloom-test-events.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    function showStats(){
      const sum=t=>events.filter(e=>e.type===t).length,win=sum('level_win'),starts=sum('level_start'),lose=sum('level_lose'),hints=sum('hint_requested');
      const played=events.filter(e=>e.type==='level_win').map(e=>e.duration_seconds||0);const secs=played.length?Math.round(played.reduce((a,b)=>a+b,0)/played.length):0;
      showModal(`<div class="modal-badge">LOCAL PLAYTEST DATA</div><h2>Test Dashboard</h2><p>Showing ${events.length} saved events. Totals and CSV cover only the most recent ${EVENT_LIMIT.toLocaleString('en-US')} events, not lifetime activity.</p><div class="metrics"><div class="metric"><div class="num">${starts}</div><div class="desc">Rounds started</div></div><div class="metric"><div class="num">${win}</div><div class="desc">Rounds won</div></div><div class="metric"><div class="num">${lose}</div><div class="desc">Tray-full losses</div></div><div class="metric"><div class="num">${secs}s</div><div class="desc">Avg. successful round</div></div><div class="metric"><div class="num">${sum('marble_pick')}</div><div class="desc">Marbles released</div></div><div class="metric"><div class="num">${hints}</div><div class="desc">Hints requested</div></div></div><p class="metric-explain"><strong>Privacy:</strong> Events stay in this browser. Older events are removed when the limit is reached; a round may be only partly represented. This dashboard does not measure retention across players, advertising revenue or D1/D7 cohorts. New events include session and round IDs; older exports may have empty ID fields.</p><div class="small-label">QUICK LEVEL TESTING</div><div class="level-picker">${LEVELS.map((lvl,i)=>`<button class="level-choice ${progress.completed[i]?'completed':''}" data-level="${i}">${i+1}</button>`).join('')}</div><div class="stats-actions"><button class="secondary-btn" id="exportEvents">↓ Export CSV</button><button class="secondary-btn" id="clearEvents">Clear Stats</button></div>`);
      $('exportEvents').onclick=downloadStats;
      $('clearEvents').onclick=()=>{if(confirm('Clear local test events? Collected artwork and unlocked levels will remain.')){events=[];save();showStats()}};
      modal.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startLevel(+b.dataset.level,'test_level_picker'));
    }
    $('tubes').addEventListener('click',e=>{let b=e.target.closest('[data-pipe]');if(b)selectTube(Number(b.dataset.pipe))});
    $('hintBtn').addEventListener('click',getHint);
    $('restartBtn').addEventListener('click',()=>restartLevel('restart_button'));
    $('roundAction').addEventListener('click',continueRound);
    $('collectionBtn').addEventListener('click',showCollection);
    $('statsBtn').addEventListener('click',showStats);
    $('soundBtn').addEventListener('click',()=>{progress.sound=!progress.sound;save();render();if(progress.sound)note(630,.1)});
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
    document.addEventListener('keydown',e=>{
      if(overlay.classList.contains('show')){
        if(e.key==='Escape'){e.preventDefault();closeModal();return}
        if(e.key==='Tab'){
          const buttons=[...modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&!el.hidden);
          const first=buttons[0],last=buttons[buttons.length-1];
          if(first&&((e.shiftKey&&document.activeElement===first)||(!e.shiftKey&&document.activeElement===last)||!modal.contains(document.activeElement))){e.preventDefault();(e.shiftKey?last:first).focus()}
        }
        return;
      }
      if(!e.repeat&&['1','2','3'].includes(e.key)&&!['INPUT','TEXTAREA','SELECT'].includes(e.target?.tagName)){e.preventDefault();selectTube(Number(e.key)-1)}
    });
    startLevel(startupLevel());
  })();

</script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
